<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Englisch Farben üben</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: background-color 0.5s ease;
      background-color: #f4f7f6;
    }

    .card {
      background: rgba(255, 255, 255, 0.95);
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.15);
      text-align: center;
      max-width: 400px;
      width: 90%;
      backdrop-filter: blur(5px);
    }

    h1 {
      color: #333;
      font-size: 20px;
      margin-top: 0;
    }

    .color-display {
      font-size: 36px;
      font-weight: bold;
      color: #2c3e50;
      margin: 25px 0;
      padding: 15px;
      border-radius: 8px;
      background-color: #ffffff;
      box-shadow: inset 0 0 5px rgba(0,0,0,0.1);
    }

    input[type="text"] {
      width: 100%;
      padding: 12px;
      font-size: 18px;
      border: 2px solid #ccc;
      border-radius: 8px;
      box-sizing: border-box;
      text-align: center;
      margin-bottom: 15px;
    }

    input[type="text"]:focus {
      border-color: #3498db;
      outline: none;
    }

    .button-group {
      display: flex;
      gap: 10px;
      justify-content: center;
    }

    button {
      padding: 12px 20px;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      flex: 1;
    }

    .btn-check {
      background-color: #2ecc71;
      color: white;
    }

    .btn-next {
      background-color: #3498db;
      color: white;
    }

    button:hover {
      opacity: 0.9;
    }

    .feedback {
      margin-top: 20px;
      font-size: 18px;
      font-weight: bold;
      min-height: 27px;
    }

    .correct {
      color: #27ae60;
    }

    .incorrect {
      color: #e74c3c;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Wie heißt die Farbe auf Englisch?</h1>
    <div class="color-display" id="colorDisplay">--</div>
    
    <input type="text" id="answerInput" placeholder="Englische Farbe eingeben..." autocomplete="off">
    
    <div class="button-group">
      <button class="btn-check" onclick="checkAnswer()">Prüfen</button>
      <button class="btn-next" onclick="nextQuestion()">Nächste Aufgabe</button>
    </div>

    <div class="feedback" id="feedback"></div>
  </div>

  <script>
    const colors = [
      { german: "Rot", english: ["red"], bgCode: "#e74c3c" },
      { german: "Blau", english: ["blue"], bgCode: "#3498db" },
      { german: "Grün", english: ["green"], bgCode: "#2ecc71" },
      { german: "Gelb", english: ["yellow"], bgCode: "#f1c40f" },
      { german: "Orange", english: ["orange"], bgCode: "#e67e22" },
      { german: "Rosa / Pink", english: ["pink"], bgCode: "#fd79a8" },
      { german: "Violett / Lila", english: ["purple", "violet"], bgCode: "#9b59b6" },
      { german: "Braun", english: ["brown"], bgCode: "#795548" },
      { german: "Schwarz", english: ["black"], bgCode: "#2d3436" },
      { german: "Weiß", english: ["white"], bgCode: "#bdc3c7" },
      { german: "Grau", english: ["grey", "gray"], bgCode: "#95a5a6" }
    ];

    let currentColor = null;
    let lastColor = null;
    let isChecked = false;

    function nextQuestion() {
      let availableColors = colors;
      if (lastColor && colors.length > 1) {
        availableColors = colors.filter(c => c.german !== lastColor.german);
      }

      const randomIndex = Math.floor(Math.random() * availableColors.length);
      currentColor = availableColors[randomIndex];
      lastColor = currentColor;
      
      document.getElementById('colorDisplay').textContent = currentColor.german;
      document.body.style.backgroundColor = currentColor.bgCode;
      
      const inputEl = document.getElementById('answerInput');
      inputEl.value = '';
      document.getElementById('feedback').textContent = '';
      document.getElementById('feedback').className = 'feedback';
      inputEl.focus();
      isChecked = false;
    }

    function checkAnswer() {
      const userInputValue = document.getElementById('answerInput').value.trim().toLowerCase();
      const feedbackEl = document.getElementById('feedback');

      if (!userInputValue) {
        feedbackEl.textContent = 'Bitte gib zuerst eine Antwort ein.';
        feedbackEl.className = 'feedback incorrect';
        return;
      }

      const isCorrect = currentColor.english.includes(userInputValue);
      const expectedText = currentColor.english.join(' oder ');

      if (isCorrect) {
        feedbackEl.textContent = 'Richtig! Gut gemacht!';
        feedbackEl.className = 'feedback correct';
      } else {
        feedbackEl.textContent = `Leider falsch. Die richtige Antwort ist: ${expectedText}`;
        feedbackEl.className = 'feedback incorrect';
      }
      isChecked = true;
    }

    document.getElementById('answerInput').addEventListener('keydown', function(event) {
      if (event.key === 'Enter') {
        event.preventDefault();
        
        if (!isChecked) {
          if (this.value.trim() !== '') {
            checkAnswer();
          }
        } else {
          nextQuestion();
        }
      }
    });

    nextQuestion();
  </script>

</body>
</html>
