  width: 100%; padding: 13px 10px; font-size: 20px; text-align: center;

<body>
<div class="container">
  <h1>Schreibe die Zahl auf Englisch!</h1>
  <div class="zahl" id="zahl">?</div>
  <input type="text" id="antwort" placeholder="Englisches Wort" autocomplete="off">
  <br>
  <button onclick="pruefen()">Prüfen</button>
  <button class="weiter" onclick="weiter()">Weiter</button>
  <div id="meldung" aria-live="polite"></div>
</div>
<script>
const zahlen = {
  1:"one", 2:"two", 3:"three", 4:"four", 5:"five", 6:"six", 7:"seven",
  8:"eight", 9:"nine", 10:"ten", 11:"eleven", 12:"twelve", 13:"thirteen",
  14:"fourteen", 15:"fifteen", 16:"sixteen", 17:"seventeen", 18:"eighteen",
  19:"nineteen", 20:"twenty", 30:"thirty", 40:"forty", 50:"fifty",
  60:"sixty", 70:"seventy", 80:"eighty", 90:"ninety", 100:"one hundred"
};
function zahlAufEnglisch(zahl) {
  if (zahlen[zahl]) return zahlen[zahl];
  const zehner = Math.floor(zahl / 10) * 10;
  const einer = zahl % 10;
  return zahlen[zehner] + "-" + zahlen[einer];
}
let aktuelleZahl;
function weiter() {
  let neueZahl;
  do { neueZahl = Math.floor(Math.random() * 100) + 1; }
  while (neueZahl === aktuelleZahl);
  aktuelleZahl = neueZahl;
  document.getElementById("zahl").textContent = aktuelleZahl;
  document.getElementById("antwort").value = "";
  document.getElementById("meldung").textContent = "";
  document.getElementById("antwort").focus();
}
function pruefen() {
  const eingabe = document.getElementById("antwort").value.trim().toLowerCase();
  const richtigeAntwort = zahlAufEnglisch(aktuelleZahl);
  const meldung = document.getElementById("meldung");
  if (eingabe === "") {
    meldung.style.color = "#b66a00";
    meldung.textContent = "Bitte gib eine Antwort ein.";
    return;
  }
  if (eingabe === richtigeAntwort) {
    meldung.style.color = "#21834d";
    meldung.textContent = "Richtig! Sehr gut!";
  } else {
    meldung.style.color = "#c62828";
    meldung.textContent = "Leider falsch. Versuche es noch einmal!";
  }
}
document.getElementById("antwort").addEventListener("keydown", function(event) {
  if (event.key === "Enter") pruefen();
});
weiter();
</script>
</body>
